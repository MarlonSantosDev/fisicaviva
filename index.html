<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Física viva</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <svg class="logo" viewBox="0 0 42 42" aria-hidden="true">
      <circle cx="21" cy="21" r="21" fill="var(--card)"/>
      <path d="M24 8c2 3 1 6-1 7" fill="none" stroke="var(--grass)" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="22" cy="8" rx="4" ry="2" fill="var(--grass)" transform="rotate(-30 22 8)"/>
      <circle cx="20" cy="24" r="10" fill="var(--force)"/>
    </svg>
    <div>
      <h1>Física viva</h1>
      <p class="kicker" id="kicker">Segunda lei · Newton</p>
    </div>
  </header>
  <nav class="topics" id="topics" aria-label="Temas"></nav>
  <main>
    <div class="stage" id="stage"></div>
    <div class="formula" id="formula" aria-live="polite"></div>
    <div class="controls" id="controls"></div>
    <section class="explain" aria-labelledby="explain-title">
      <h2 id="explain-title">O que o desenho mostra</h2>
      <p id="explain-text"></p>
      <p class="simplify" id="simplify"></p>
    </section>
  </main>
  <noscript>Ative o JavaScript para ver as animações.</noscript>
  <script src="js/util.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/sim/inercia.js"></script>
  <script src="js/sim/newton2.js"></script>
  <script src="js/sim/acao.js"></script>
  <script src="js/sim/queda.js"></script>
  <script src="js/sim/gravidade.js"></script>
  <script src="js/sim/energia.js"></script>
  <script src="js/sim/onda.js"></script>
  <script src="js/sim/ohm.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
